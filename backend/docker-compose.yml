services:

  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: redis-stack

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    restart: unless-stopped

    networks:
      - food-delivery-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  kafka:
    image: apache/kafka:latest
    container_name: kafka

    ports:
      - "9094:9094"

    environment:

      # KRaft cluster configuration
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      #KRaft configurtion: single node broker + controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller

      # Controller listener
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094

      # Advertised addresses for Docker and host applications
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node development configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Development-friendly
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Persistent Kafka storage
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    restart: unless-stopped

    networks:
      - food-delivery-network


  backend:

    image: food-delivery-backend:v1

    build:
      context: .
      dockerfile: ./Dockerfile

    env_file:
      - .env

    environment:
      KAFKA_BROKER: kafka:9092

    ports:
      - "4000:4000"

    networks:
      - food-delivery-network

    restart: unless-stopped

    depends_on:
      redis-stack:
        condition: service_healthy

      kafka:
        condition: service_healthy


  email-worker:
    image: food-delivery-backend:v1

    env_file:
      - .env

    environment:
      KAFKA_BROKERS: kafka:9092

    command: ["node", "dist/workers/email-worker.main.js"]

    networks:
      - food-delivery-network

    restart: unless-stopped

    depends_on:
      redis-stack:
        condition: service_healthy


networks:
  food-delivery-network:
    name: food-delivery-network
    driver: bridge

volumes:
  redis-data:
  kafka-data:
